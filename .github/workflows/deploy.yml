name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  BQ_DATASET: ${{ vars.BQ_DATASET || 'searchconsole' }}
  BQ_TABLE: ${{ vars.BQ_TABLE || 'searchdata_url_impression' }}

jobs:
  deploy:
    name: Test & Deploy
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Format check
        run: bun run format:check
      - name: Unit tests
        run: bun run test
      - name: Authenticate to GCP
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: Integration tests
        run: bun run test:integration
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          BQ_DATASET: ${{ env.BQ_DATASET }}
          BQ_TABLE: ${{ env.BQ_TABLE }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy gsc-mcp \
            --source . \
            --region ${{ vars.GCP_REGION || 'us-east1' }} \
            --service-account gsc-mcp-sa@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 1 \
            --timeout 3600 \
            --session-affinity \
            --set-env-vars "GCP_PROJECT_ID=${{ vars.GCP_PROJECT_ID }},BQ_DATASET=${{ env.BQ_DATASET }},BQ_TABLE=${{ env.BQ_TABLE }},ALLOWED_DOMAIN=${{ vars.ALLOWED_DOMAIN }},GOOGLE_OAUTH_CLIENT_ID=${{ vars.GOOGLE_OAUTH_CLIENT_ID }},SERVER_URL=${{ vars.SERVER_URL }},FIRESTORE_OAUTH_DATABASE=${{ vars.FIRESTORE_OAUTH_DATABASE }}" \
            --set-secrets "GOOGLE_OAUTH_CLIENT_SECRET=gsc-mcp-oauth-secret:latest,JWT_SECRET=gsc-mcp-jwt-secret:latest"
